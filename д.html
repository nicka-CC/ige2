  const quiz = document.getElementById("quiz");

  questions.forEach((item,index)=>{

    const div = document.createElement("div");

    div.className = "question";

            ${item.q}

            ${item.code ? `<code>${item.code}</code>` : ""}
        </h3>

        <div class="answers">

            <label>
                <input type="radio" name="q${index}" value="a">
                ${item.a[0]}
            </label>

            </label>

            </label>

            </label>

        </div>
    `;

  function checkAnswers(){

    let score = 0;

    questions.forEach((q,index)=>{

      const answer = document.querySelector(
              `input[name="q${index}"]:checked`
      );

      if(answer && answer.value === q.correct){
        score++;
      }

    });

    const result = document.getElementById("result");
    const scoreBlock = document.getElementById("score");
    const message = document.getElementById("message");

    result.style.display = "block";

    scoreBlock.innerHTML = `${score} / 30`;

    if(score >= 26){

      scoreBlock.className = "score good";

      message.innerHTML =
              "☠️ Ты .NET монстр уровня senior";

    }
    else if(score >= 18){

      scoreBlock.className = "score";

      message.innerHTML =
              "⚡ Очень хороший уровень";

    }
    else{

      scoreBlock.className = "score bad";

      message.innerHTML =
              "💀 CLR уже знает твой адрес";
    }

    window.scrollTo({
      top:document.body.scrollHeight,
      behavior:"smooth"
    });
